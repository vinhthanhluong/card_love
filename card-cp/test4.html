<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Button Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .memory-button {
            position: relative;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, rgb(255 105 180 / 85%), rgb(255 20 147 / 73%));
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: slowGradient 6s ease infinite;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            letter-spacing: 0.5px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Gradient chuyển động chậm */
        @keyframes slowGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Hiệu ứng sáng lướt qua */
        .memory-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }
            50%, 100% {
                left: 200%;
            }
        }

        /* Gợn sóng khi click */
        .memory-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s, opacity 0.6s;
            opacity: 0;
        }

        .memory-button:active::after {
            width: 300px;
            height: 300px;
            opacity: 1;
            transition: 0s;
        }

        /* Hover - chỉ hiển thị trên desktop */
        @media (hover: hover) {
            .memory-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(255, 20, 147, 0.5);
            }
        }

        /* Active state cho mobile */
        .memory-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.3);
        }

        /* Floating hearts animation */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            animation: floatHeart 4s ease-in-out infinite;
            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 1s;
        }

        .heart:nth-child(3) {
            right: 30%;
            animation-delay: 2s;
        }

        .heart:nth-child(4) {
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes floatHeart {
            0% {
                bottom: -20px;
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                bottom: 120%;
                opacity: 0;
                transform: translateY(-20px) rotate(15deg);
            }
        }

        /* Container */
        .button-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Responsive cho mobile */
        @media (max-width: 768px) {
            .memory-button {
                padding: 14px 35px;
                font-size: 16px;
                animation-duration: 8s; /* Chậm hơn trên mobile */
            }

            .heart {
                font-size: 10px;
            }

            @keyframes floatHeart {
                0% {
                    bottom: -15px;
                    opacity: 0;
                }
                50% {
                    opacity: 0.8;
                }
                100% {
                    bottom: 100%;
                    opacity: 0;
                }
            }
        }

        @media (max-width: 480px) {
            .memory-button {
                padding: 12px 30px;
                font-size: 15px;
            }
        }

        /* Pulse nhẹ */
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            }
            50% {
                box-shadow: 0 4px 20px rgba(255, 20, 147, 0.6);
            }
        }

        .memory-button {
            animation: slowGradient 6s ease infinite, pulse 3s ease-in-out infinite;
        }
    </style>
  </head>
  <body>
    <div class="button-wrapper">
      <p class="memory-button" id="openMemory">
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        Xem kỉ niệm
      </p>
    </div>

    <script>
        document.getElementById('openMemory').addEventListener('click', function(e) {
            // Tạo hiệu ứng ripple tại vị trí click
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.5);
                left: ${x}px;
                top: ${y}px;
                pointer-events: none;
                animation: rippleEffect 0.6s ease-out;
            `;
            
            this.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
            
            // Xử lý sự kiện của bạn ở đây
            console.log('Button clicked!');
        });
        
        // CSS cho ripple effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
  </body>
</html>
