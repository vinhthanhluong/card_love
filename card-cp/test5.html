<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ Đếm Ngày Yêu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    .container {
      background: linear-gradient(135deg, #ec4899 0%, #ef4444 50%, #f43f5e 100%);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 360px;
      width: 100%;
    }

    .hourglass-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .hourglass, .hourglass:before, .hourglass:after {
      animation-duration: 4s;
      animation-iteration-count: infinite;
    }

    .hourglass {
      --polygonH: polygon(0% 0%,100% 0%,100% 5.55%,95% 5.55%,95% 28%,60% 46%,60% 54%,95% 72%,95% 94.45%,100% 94.45%,100% 100%,0% 100%,0% 94.45%,5% 94.45%,5% 72%,40% 54%,40% 46%,5% 28%,5% 5.55%,0% 5.55%);
      animation-name: flip;
      animation-timing-function: ease-in-out;
      background-image: linear-gradient(rgba(255,255,255,0.3) 0.5em, rgba(255,255,255,0.1) 0.5em 8.5em, rgba(255,255,255,0.3) 8.5em);
      clip-path: var(--polygonH);
      -webkit-clip-path: var(--polygonH);
      overflow: hidden;
      position: relative;
      width: 5em;
      height: 9em;
      z-index: 0;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
    }

    .hourglass:before, .hourglass:after {
      animation-timing-function: linear;
      content: "";
      display: block;
      position: absolute;
    }

    .hourglass:before {
      --polygonB1: polygon(0% 0%,100% 0%,100% 24%,50% 47%,50% 47%,50% 47%,50% 47%,50% 47%,50% 47%,50% 47%,50% 47%,0% 24%);
      --polygonB2: polygon(0% 4%,100% 4%,100% 24%,55% 45%,55% 100%,55% 100%,55% 100%,45% 100%,45% 100%,45% 100%,45% 45%,0% 24%);
      --polygonB3: polygon(0% 24%,100% 24%,100% 24%,55% 45%,55% 80%,100% 100%,100% 100%,0% 100%,0% 100%,45% 80%,45% 45%,0% 24%);
      --polygonB4: polygon(45% 45%,55% 45%,55% 45%,55% 45%,55% 58%,100% 76%,100% 100%,0% 100%,0% 76%,45% 58%,45% 45%,45% 45%);
      --polygonB5: polygon(50% 53%,50% 53%,50% 53%,50% 53%,50% 53%,100% 76%,100% 100%,0% 100%,0% 76%,50% 53%,50% 53%,50% 53%);
      animation-name: fill;
      background-color: #FFD700;
      background-size: 100% 3.6em;
      clip-path: var(--polygonB1);
      -webkit-clip-path: var(--polygonB1);
      top: 0.5em;
      left: 0.5em;
      width: 4em;
      height: 8em;
      z-index: 1;
    }

    .hourglass:after {
      animation-name: glare;
      background:
        linear-gradient(90deg,#0000 0.5em,#0003 0.5em 1.5em,#0000 1.5em 3.5em,#fff3 3.5em 4.5em,#fff0 4.5em 6.5em,#0003 6.5em 7.5em,#0000 7.5em) 0 0 / 100% 0.5em,
        linear-gradient(90deg,#0000 0.75em,#0003 0.75em 1.25em,#0000 1.25em 3.75em,#fff3 3.75em 4.25em,#fff0 4.25em 6.75em,#0003 6.75em 7.25em,#0000 7.25em) 0 0.5em / 100% 8em,
        linear-gradient(90deg,#0000 0.5em,#0003 0.5em 1.5em,#0000 1.5em 3.5em,#fff3 3.5em 4.5em,#fff0 4.5em 6.5em,#0003 6.5em 7.5em,#0000 7.5em) 0 100% / 100% 0.5em;
      background-repeat: repeat-x;
      top: 0;
      left: -3em;
      width: 200%;
      height: 100%;
      z-index: 2;
    }

    /* Heart in center */
    .heart-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1);
      }
      50% { 
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    .days-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin: 0 auto 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .days-number {
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
    }

    .days-label {
      color: white;
      font-size: 1rem;
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 0.75rem 0.5rem;
      border-radius: 0.5rem;
      text-align: center;
      min-width: 60px;
    }

    .time-value {
      color: white;
      font-weight: 600;
      font-size: 1rem;
    }

    .time-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }

    .separator {
      color: rgba(255, 255, 255, 0.6);
      font-weight: bold;
      font-size: 1.25rem;
    }

    .heart-icon {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .center {
      text-align: center;
    }

    /* Animations */
    @keyframes fill {
      from {
        clip-path: var(--polygonB1);
        -webkit-clip-path: var(--polygonB1);
      }
      10% {
        clip-path: var(--polygonB2);
        -webkit-clip-path: var(--polygonB2);
      }
      45% {
        clip-path: var(--polygonB3);
        -webkit-clip-path: var(--polygonB3);
      }
      80% {
        clip-path: var(--polygonB4);
        -webkit-clip-path: var(--polygonB4);
      }
      85%, to {
        clip-path: var(--polygonB5);
        -webkit-clip-path: var(--polygonB5);
      }
    }

    @keyframes flip {
      from, 90% {
        transform: rotate(0);
      }
      to {
        transform: rotate(180deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="center">
      <!-- Đồng hồ cát -->
      <div class="hourglass-wrapper">
        <div class="hourglass" style="position: relative;">
          <svg class="heart-center" width="24" height="24" viewBox="0 0 24 24" fill="#ff69b4">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <!-- Số ngày -->
      <div class="days-badge">
        <svg class="heart-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="days-number" id="days">0</span>
        <span class="days-label">ngày</span>
      </div>
      
      <!-- Giờ phút giây -->
      <div class="time-row">
        <div class="time-box">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">giờ</div>
        </div>
        <div class="separator">:</div>
        <div class="time-box">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">phút</div>
        </div>
        <div class="separator">:</div>
        <div class="time-box">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">giây</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Thay đổi ngày bắt đầu yêu tại đây
    const startDate = new Date('2024-01-01T00:00:00');

    function updateTime() {
      const now = new Date();
      const difference = now - startDate;
      
      const d = Math.floor(difference / (1000 * 60 * 60 * 24));
      const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((difference % (1000 * 60)) / 1000);
      
      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }

    // Cập nhật thời gian mỗi giây
    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>
